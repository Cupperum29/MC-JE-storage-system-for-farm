name: "需要收集"
description: "需要机器收集选这个"
title: "机器名称：（可直接复制投影文件名称、存档名称或者视频标题）"
labels: ["待做收集"]
assignees: 
   - Cupperum29
body:

  - type: textarea
    id: archive_link
    attributes:
      label: 存档/投影
      description: 在此处上传存档或投影，绑定种子、依赖结构、有位置性、需要严格对门的机器必须上传存档
    validations:
      required: true

  - type: input
    id: video_link
    attributes:
      label: 机器视频链接
      description: 请提供原机器的演示视频链接
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: game_version
    attributes:
      label: 游戏版本
      description: 此处应填写机器版本和收集版本的交集
      placeholder: "例如某机器为1.18.2~26.1.2，而收集使用了合成器（1.21+），则应为1.21~26.1.2"
    validations:
      required: true

  - type: textarea
    id: item_types_and_efficiency
    attributes:
      label: 需要收集物品的各自效率
      description: 在这里填写需要收集的物品的种类和对应的效率，最好是作者给的效率表，若为自己测试的效率截图则需额外标注需要收集哪些物品
      placeholder: "物品A：...\n物品B：..."
    validations:
      required: true
  
  - type: textarea
    id: disolve_method
    attributes:
      label: 收集方式
      description: 请说明机器的收集方式
      placeholder: "需详细描述每种产物如何收集\n例如“烧车分流金粒后合成为金块并打包，金锭使用分类合成打包机合成为金块并打包”\n“模式选择切换堆分漏斗，堆分后接换盒混杂打包机”"
    validations:
      required: true
      
  - type: textarea
    id: item_storage
    attributes:
      label: 每种物品的储量
      description: 请对应上面列出的物品，填写每种物品的大致储量（大宗一片220w储量），小机器可忽略
      placeholder: "物品A：...\n物品B：..."
    validations:
      required: true
