name: "需要收集"
description: "需要机器收集选这个"
title: "机器名称：（可复制粘贴投影文件名称、存档文件夹名称或者视频标题）"
labels: ["待做收集"]
assignees: 
   - Cupperum29
body:

  - type: textarea
    id: archive_link
    attributes:
      label: 存档/投影
      description: 在此处上传存档或投影，绑定种子、依赖结构、有位置性、需要严格对门的机器必须上传存档
      placeholder: "将投影文件或存档压缩包拖拽至此处"
    validations:
      required: true

  - type: input
    id: video_link
    attributes:
      label: 机器视频链接
      description: 在此处粘贴原机器的演示视频链接或者BV号，若及其名称处为视频标题则必须在此处附上视频链接或者BV号
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: game_version
    attributes:
      label: 游戏版本
      description: 此处应填写机器版本和收集版本的交集
      placeholder: "例如某机器为1.18.2~26.1.2，而收集使用了合成器（1.21+），则应为1.21~26.1.2"
    validations:
      required: true

  - type: textarea
    id: types_and_efficiency
    attributes:
      label: 需要收集物品的各自效率
      description: 在这里填写所有物品的效率（建议使用作者提供的效率表）和所需收集的物品的种类
      placeholder: "例如\n 物品A（收集）：...\n 物品B（不收集）：..."
    validations:
      required: true
  
  - type: textarea
    id: method
    attributes:
      label: 收集方式
      description: 请说明机器的收集方式
      placeholder: "需详细描述每种产物如何收集\n例如“烧车分流金粒后合成为金块并打包，金锭使用分类合成打包机合成为金块并打包”\n“模式选择切换堆分漏斗，堆分后接换盒混杂打包机”"
    validations:
      required: false
      
  - type: textarea
    id: capacity
    attributes:
      label: 每种物品的储量
      description: 请对应上面列出的物品，填写每种物品的大致储量（大宗一片220w储量），小机器可忽略
      placeholder: "物品A：...\n物品B：..."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 备注
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      description: 请确认你已完成以下步骤
      options:
        - label: 收集方式仅为个人意见，若有更好的愿意更换收集方式，不勾选代表只接受该收集方式
        - label: 我已熟读[README.md](https://github.com/Cupperum29/MC-JE-storage-system-for-farm/blob/main/README.md)，已熟知其中所有的注意事项
          required: true
        - label: 我已在仓库和带“待做收集”标签的issue中搜索过，目前没有我需要的收集
          required: true
        - label: 我承诺我将一次性说明所有需求，不会在收集完成后再给该收集提新要求
          required: true
