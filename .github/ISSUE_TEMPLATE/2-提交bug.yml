name: "提交bug"
description: "收集有bug选这个，机器本身bug请找原作者"
title: "在此处简述收集的bug"
labels: ["bug"]
assignees: 
   - Cupperum29
body:

   - type: input
     id: name
     attributes:
       label: 投影/存档的名称
       description: 在此处填写收集的投影文件名或存档的文件夹名
     validations:
       required: true

   - type: textarea
     id: bug_desc
     attributes:
       label: 详细描述收集的bug
       description: 在此处描述收集的bug，尽量搭配上截图和标注
       placeholder: "例如：大宗盒子分类第六片的分类物应为xx，实则为xx；\n补盒水道某处中断，缺少一个水源（此处补上截图）；\n……"
     validations:
       required: true
   
   - type: checkboxes
     id: checklist
     attributes:
       label: 提交前检查
       description: 请确认你已完成以下步骤
       options:
        - label: 我已知晓此仅为收集的提交bug界面，并非机器本身的提交bug界面，机器本身的bug应找原作者而非收集作者
          required: true
        - label: 已在仅有锂的Fabric/无模组和加载器的环境下测试过，已排除模组对收集的影响；若需开启carpet的移植规则，则在测试时仅保留该移植规则开启，其余规则皆为默认值
          required: true
        - label: 已在issue中搜索过，该bug尚未被提交过
          required: true
